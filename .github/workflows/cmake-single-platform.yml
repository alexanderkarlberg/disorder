# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '00 8 * * 1,2,3,4,5'
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: chmod 755 ${{github.workspace}}/.github_CI.sh; ${{github.workspace}}/.github_CI.sh

    - name: Configure CMake
      # Configured as for the reference results in validation/ref_runs, so
      # that ctest also runs the validation matrix.
      run: >
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DNEEDS_FASTJET=ON -DANALYSIS=exclusive_lab_frame_analysis.f

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j $(nproc)

    - name: Test
      # Unit tests and the full validation matrix (see validation/)
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} -j $(nproc) --output-on-failure

  keepalive:
    # GitHub disables scheduled workflows after 60 days without activity in
    # the repository. Re-enabling the workflow through the API resets that
    # timer, without the need for dummy commits.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Re-enable this workflow
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh api --method PUT
        "repos/${{ github.repository }}/actions/workflows/cmake-single-platform.yml/enable"
